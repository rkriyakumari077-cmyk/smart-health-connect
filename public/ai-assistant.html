<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Health Assistant - Smart Health Connect</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="navbar"></nav>

  <div class="container">
    <h1>AI Health Assistant</h1>
    <p class="muted">Describe how you feel in English or Hinglish, or tick your symptoms. The assistant suggests what to do and which doctor to see.</p>

    <div class="card">
      <label for="symptom-text">How are you feeling?</label>
      <textarea id="symptom-text" rows="3" placeholder="Example: bukhar aur sar dard 2 din se"></textarea>

      <label>Or tick your symptoms</label>
      <div class="symptom-list" id="symptom-list"></div>

      <div class="form-row">
        <div>
          <label for="days">For how many days?</label>
          <input type="number" id="days" min="0" max="365" placeholder="Example: 2">
        </div>
        <div>
          <label for="age">Age</label>
          <input type="number" id="age" min="0" max="120">
        </div>
      </div>
      <br>
      <button class="btn" onclick="runCheck()">Check my symptoms</button>
      <div id="check-message"></div>
    </div>

    <div id="result"></div>

    <div class="card">
      <h2>My past checks</h2>
      <div id="history">Loading...</div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/ai-rules.js"></script>
  <script src="js/ai-assistant.js"></script>
</body>
</html>
